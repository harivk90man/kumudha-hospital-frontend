<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumudha Hospital — HMS · Villupuram</title>
<style>
  :root{
    --primary:#0EA5A4; --primary-dark:#0F766E; --primary-light:#CCFBF1;
    --accent:#6366F1; --accent-light:#E0E7FF;
    --success:#10B981; --warning:#F59E0B; --danger:#EF4444; --info:#3B82F6;
    --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC;
    --sidebar:#0F172A; --sidebar-2:#1E293B; --sidebar-text:#CBD5E1;
    --text:#0F172A; --muted:#64748B; --border:#E2E8F0;
    --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
    --shadow-lg:0 10px 25px rgba(15,23,42,.10), 0 4px 10px rgba(15,23,42,.05);
    --radius:10px; --radius-sm:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--primary-dark);text-decoration:none}

  /* ============ LOGIN ============ */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
              background:linear-gradient(135deg,#0F766E 0%,#134E4A 50%,#0F172A 100%);padding:24px}
  .login-card{background:var(--surface);border-radius:16px;padding:40px;width:100%;max-width:980px;box-shadow:var(--shadow-lg)}
  .login-header{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .logo-mark{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#0EA5A4,#0F766E);
             display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:700;box-shadow:var(--shadow-lg)}
  .login-title{font-size:24px;font-weight:700;letter-spacing:-0.3px}
  .login-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .login-prompt{font-size:13px;color:var(--muted);margin:24px 0 12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .persona-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .persona{padding:16px;border:2px solid var(--border);border-radius:var(--radius);text-align:left;
           transition:all .15s;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .persona:hover{border-color:var(--primary);background:var(--primary-light);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .persona .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
                   font-size:20px;background:var(--surface-2);margin-bottom:6px}
  .persona .name{font-weight:600;font-size:14px}
  .persona .role{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .login-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);
                display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}

  /* ============ APP SHELL ============ */
  .app{display:grid;grid-template-columns:240px 1fr;height:100vh}
  .sidebar{background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;overflow:hidden}
  .sb-brand{padding:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sidebar-2)}
  .sb-brand .logo-mark{width:36px;height:36px;font-size:18px;border-radius:10px}
  .sb-brand .nm{font-weight:700;font-size:14px;color:#fff}
  .sb-brand .sub{font-size:11px;color:#94A3B8}
  .sb-user{padding:14px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--sidebar-2)}
  .sb-user .av{width:36px;height:36px;border-radius:50%;background:var(--sidebar-2);display:flex;align-items:center;justify-content:center;font-size:18px}
  .sb-user .n{font-weight:600;color:#fff;font-size:13px}
  .sb-user .r{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px}
  .sb-nav{flex:1;overflow-y:auto;padding:12px 8px}
  .sb-nav-section{padding:8px 12px 4px;font-size:10px;color:#64748B;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .sb-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#CBD5E1;
           font-size:13px;cursor:pointer;transition:all .12s;width:100%;text-align:left}
  .sb-link:hover{background:var(--sidebar-2);color:#fff}
  .sb-link.active{background:var(--primary-dark);color:#fff;font-weight:600}
  .sb-link .ico{width:18px;text-align:center;font-size:14px}
  .sb-link .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600}
  .sb-foot{padding:14px 20px;border-top:1px solid var(--sidebar-2);font-size:12px}
  .sb-foot button{color:#94A3B8;font-size:12px;display:flex;align-items:center;gap:6px}
  .sb-foot button:hover{color:#fff}

  .main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;
          display:flex;align-items:center;justify-content:space-between;gap:16px}
  .topbar .title{font-size:18px;font-weight:700;letter-spacing:-0.2px}
  .topbar .breadcrumb{font-size:12px;color:var(--muted);margin-top:2px}
  .topbar .right{display:flex;align-items:center;gap:12px}
  .topbar .search{display:flex;align-items:center;gap:8px;background:var(--surface-2);padding:8px 12px;
                  border-radius:8px;border:1px solid var(--border);width:280px}
  .topbar .search input{border:none;outline:none;background:transparent;flex:1;font-size:13px}
  .topbar .pill{padding:6px 12px;background:var(--primary-light);color:var(--primary-dark);border-radius:999px;font-size:12px;font-weight:600}
  .content{flex:1;overflow-y:auto;padding:24px 28px}

  /* ============ COMPONENTS ============ */
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;border:1px solid var(--border)}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
  .card-title{font-size:15px;font-weight:700;letter-spacing:-0.2px}
  .card-sub{font-size:12px;color:var(--muted);margin-top:2px}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .row{display:flex;gap:12px;align-items:center}

  .stat{padding:18px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow)}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .stat .val{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-top:6px;color:var(--text)}
  .stat .delta{font-size:12px;font-weight:600;margin-top:4px}
  .stat .delta.up{color:var(--success)} .stat .delta.down{color:var(--danger)}
  .stat .ico{float:right;width:40px;height:40px;border-radius:10px;background:var(--primary-light);
             display:flex;align-items:center;justify-content:center;font-size:20px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 12px;font-size:11px;color:var(--muted);text-transform:uppercase;
     letter-spacing:.5px;font-weight:600;border-bottom:1px solid var(--border);background:var(--surface-2)}
  td{padding:12px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--surface-2)}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;
       font-weight:600;font-size:13px;transition:all .12s;border:1px solid transparent}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}
  .btn-secondary:hover{background:var(--bg)}
  .btn-success{background:var(--success);color:#fff}
  .btn-success:hover{filter:brightness(.92)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-ghost{color:var(--primary-dark);font-weight:600;font-size:13px;padding:6px 10px}
  .btn-ghost:hover{background:var(--primary-light);border-radius:6px}
  .btn-sm{padding:5px 10px;font-size:12px}
  .btn-lg{padding:12px 18px;font-size:14px}

  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .pill-success{background:#D1FAE5;color:#065F46}
  .pill-warn{background:#FEF3C7;color:#92400E}
  .pill-danger{background:#FEE2E2;color:#991B1B}
  .pill-info{background:#DBEAFE;color:#1E40AF}
  .pill-purple{background:var(--accent-light);color:#3730A3}
  .pill-teal{background:var(--primary-light);color:var(--primary-dark)}
  .pill-grey{background:#E2E8F0;color:#475569}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);outline:none;transition:border-color .12s
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary)}
  .field textarea{resize:vertical;min-height:80px;font-family:inherit}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* timeline */
  .timeline{position:relative;padding-left:24px}
  .timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
  .tl-item{position:relative;padding-bottom:18px}
  .tl-item::before{content:'';position:absolute;left:-21px;top:6px;width:14px;height:14px;border-radius:50%;
                   background:var(--surface);border:3px solid var(--primary)}
  .tl-item.done::before{background:var(--primary)}
  .tl-item .t{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
  .tl-item .ev{font-weight:600;font-size:13px;margin-top:2px}
  .tl-item .meta{font-size:12px;color:var(--muted);margin-top:2px}

  /* Payment 360 — shows polymorphic bridge */
  .pay-card{background:linear-gradient(135deg,#0F766E,#0EA5A4);color:#fff;padding:20px;border-radius:12px;margin-bottom:16px}
  .pay-card .amt{font-size:32px;font-weight:700;letter-spacing:-0.5px}
  .pay-card .lbl{opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .pay-line{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);
            border-radius:10px;margin-bottom:8px;background:var(--surface);transition:all .12s}
  .pay-line:hover{border-color:var(--primary);background:var(--primary-light)}
  .pay-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
           font-size:22px;flex-shrink:0}
  .pay-ico.xray{background:#DBEAFE;color:#1E40AF}
  .pay-ico.pharma{background:#D1FAE5;color:#065F46}
  .pay-ico.consult{background:var(--accent-light);color:#3730A3}
  .pay-ico.lab{background:#FEF3C7;color:#92400E}
  .pay-ico.cafe{background:#FCE7F3;color:#9D174D}
  .pay-info{flex:1}
  .pay-info .nm{font-weight:600;font-size:14px}
  .pay-info .meta{font-size:12px;color:var(--muted);margin-top:2px;font-family:'SFMono-Regular',Consolas,monospace}
  .pay-amt{font-weight:700;font-size:16px}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .modal-h{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-h .t{font-size:16px;font-weight:700}
  .modal-b{padding:24px}
  .modal-f{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2)}

  /* Toast */
  .toasts{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);
         display:flex;align-items:center;gap:10px;animation:slideIn .25s ease;max-width:340px;font-size:13px;font-weight:500}
  .toast.success{background:var(--success)} .toast.warn{background:var(--warning)} .toast.danger{background:var(--danger)}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

  /* Bar chart */
  .bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding:10px 0}
  .bar{flex:1;background:linear-gradient(180deg,var(--primary),var(--primary-dark));
       border-radius:6px 6px 0 0;position:relative;transition:opacity .15s;min-height:8px}
  .bar:hover{opacity:.8}
  .bar .v{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
  .bar .l{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}

  /* Donut (CSS conic) */
  .donut{width:160px;height:160px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .donut::before{content:'';position:absolute;inset:30px;background:var(--surface);border-radius:50%}
  .donut .ctr{position:relative;z-index:2;text-align:center}
  .donut .ctr .v{font-size:22px;font-weight:700}
  .donut .ctr .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px}
  .legend-dot{width:10px;height:10px;border-radius:3px}

  /* Queue card */
  .queue-row{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);
             border:1px solid var(--border);border-radius:10px;margin-bottom:8px;transition:all .12s}
  .queue-row:hover{border-color:var(--primary);box-shadow:var(--shadow)}
  .token-chip{font-family:'SFMono-Regular',Consolas,monospace;font-weight:700;background:var(--primary);
              color:#fff;padding:8px 12px;border-radius:8px;min-width:60px;text-align:center}
  .token-chip.lab{background:var(--accent)}
  .token-chip.xray{background:var(--info)}
  .token-chip.pharma{background:var(--success)}

  hr{border:none;border-top:1px solid var(--border);margin:14px 0}

  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
  .empty .e-ico{font-size:36px;margin-bottom:10px;opacity:.4}

  /* Patient avatar */
  .pavatar{width:36px;height:36px;border-radius:50%;background:var(--accent-light);color:#3730A3;
           display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

  /* Fade-in for view changes */
  .content > * { animation: fade .2s ease }
  @keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  /* Schema hint panel — shown at top of every view */
  .schema-hint{background:#0F172A;color:#94A3B8;border-radius:10px;padding:12px 16px;margin-bottom:16px;
               display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;font-size:11px;border-left:4px solid var(--primary);box-shadow:var(--shadow)}
  .schema-hint .lbl{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:#475569;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  .schema-hint .lbl.r{color:#10B981} .schema-hint .lbl.w{color:#F59E0B} .schema-hint .lbl.j{color:#6366F1}
  .schema-hint code{background:#1E293B;color:#CBD5E1;padding:2px 6px;border-radius:4px;
                    font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;display:inline-block;margin:1px 2px;border:1px solid #334155}
  .schema-hint code.write{color:#FCD34D;border-color:#92400E}
  .schema-hint code.join{color:#A5B4FC;border-color:#4338CA}
  .schema-hint .desc{color:#CBD5E1;line-height:1.6}

  /* Inline mini-hint on cards */
  .mini-hint{font-size:10px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
             display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:'SFMono-Regular',Consolas,monospace}
  .mini-hint .tag{background:var(--primary-light);color:var(--primary-dark);padding:1px 6px;border-radius:3px;font-weight:600}
  .mini-hint .tag.w{background:#FEF3C7;color:#92400E}
  .mini-hint .arr{color:#94A3B8;margin:0 2px}

  /* Bed grid */
  .bed-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
  .bed{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:6px;font-size:11px;font-weight:600;cursor:pointer;border:2px solid transparent}
  .bed.available{background:#D1FAE5;color:#065F46;border-color:#10B981}
  .bed.occupied{background:#FEE2E2;color:#991B1B;border-color:#EF4444}
  .bed.cleaning{background:#FEF3C7;color:#92400E;border-color:#F59E0B}
  .bed:hover{transform:scale(1.05)}
  .bed .num{font-size:13px;font-weight:700}
  .bed .stat{font-size:9px;text-transform:uppercase;opacity:.8}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* ===========================================================================
   KUMUDHA HOSPITAL - HMS PROTOTYPE
   Single-file interactive demo. Persists state to localStorage.
   =========================================================================== */

const HOSPITAL = {
  name: "Kumudha Hospital",
  city: "Villupuram",
  tagline: "Compassionate Care · Modern Medicine",
  address: "Salem Road, Villupuram, Tamil Nadu 605602",
  phone: "+91 4146 222 333",
  uhid_prefix: "KH"
};

/* ============ PERSONAS ============ */
const PERSONAS = [
  { id:'fd1',  name:'Latha S.',          role:'Front Desk',     dept:'Reception',     icon:'👩'      , module:'fd'    },
  { id:'doc1', name:'Dr. Naveen R.',     role:'Doctor',         dept:'Orthopedics',   icon:'👨‍⚕️'    , module:'doc'   },
  { id:'doc2', name:'Dr. Priya K.',      role:'Doctor',         dept:'Pediatrics',    icon:'👩‍⚕️'    , module:'doc'   },
  { id:'nur1', name:'Sister Meena',      role:'Nurse',          dept:'IP Ward',       icon:'🩺'      , module:'nurse' },
  { id:'pha1', name:'Karthik V.',        role:'Pharmacy',       dept:'Pharmacy',      icon:'💊'      , module:'pharma'},
  { id:'lab1', name:'Saranya M.',        role:'Lab Tech',       dept:'Laboratory',    icon:'🧪'      , module:'lab'   },
  { id:'rad1', name:'Dr. Vinod K.',      role:'Radiologist',    dept:'Radiology',     icon:'🩻'      , module:'rad'   },
  { id:'adm1', name:'Mrs. Rajeswari',    role:'Admin',          dept:'Operations',    icon:'🏥'      , module:'admin' },
  { id:'fdr1', name:'Dr. K. Arumugam',   role:'Founder · CEO',  dept:'Strategy',      icon:'👑'      , module:'founder'},
  { id:'hr1',  name:'Bhavani N.',        role:'HR Manager',     dept:'Human Resources',icon:'🧑‍💼'    , module:'hr'    },
  { id:'pat1', name:'Saravanan P.',      role:'Patient',        dept:'KH-2026-000123',icon:'🧑'      , module:'patient'},
];

/* ============ MOCK STATE — table names mirror HMS v7.1 schema ============ */
/*
   Schema mapping (every key here corresponds to a real table in hms_full_schema_v7.html):
   - patients              ← § Patients module
   - users                 ← § Identity & Access (doctor accounts)
   - doctor_profiles       ← § Identity & Access (specialty/fees extension)
   - op_visits             ← § Visits module (visit lifecycle)
   - tokens                ← § Visits module (D-04 etc.)
   - vitals                ← § Visits module
   - consultations         ← § Clinical module
   - prescriptions/items   ← § Clinical module
   - lab_orders            ← § Lab module
   - radiology_orders      ← § Radiology module
   - medicines             ← § Pharmacy & Inventory
   - pharmacy_sales        ← § Pharmacy & Inventory
   - rooms / beds          ← § Inpatient module
   - payments              ← § Billing module
   - payment_item_types 🆕 ← § Billing (lookup)
   - payment_items 🆕      ← § Billing (polymorphic bridge)
   - payment_xray 🆕       ← § Billing (per-type detail)
   - payment_pharmacy 🆕   ← § Billing (per-type detail)
   - payment_consultation 🆕 ← § Billing (per-type detail)
   - payment_lab 🆕        ← § Billing (per-type detail)
   - payment_cafeteria 🆕  ← § Billing (per-type detail)
*/
const STATE = {
  patients: [

/* persist + restore — versioned so demo-data upgrades auto-invalidate stale caches */
const STATE_VERSION = 'v8-2026-05-09-locked';
let _staleStateCleared = false;
function saveState(){ try{ localStorage.setItem('kh_state', JSON.stringify({_v:STATE_VERSION, data:STATE})); }catch(e){} }
function loadState(){
  try{
    const s = localStorage.getItem('kh_state');
    if(!s) return;
    const parsed = JSON.parse(s);
    if(!parsed || parsed._v !== STATE_VERSION){
      localStorage.removeItem('kh_state');
      _staleStateCleared = true;
      console.log('[Kumudha HMS] Stale demo data ignored. Refreshed to '+STATE_VERSION);
      return;
    }
    Object.assign(STATE, parsed.data);
  }catch(e){}
}
function resetState(){ localStorage.removeItem('kh_state'); location.reload(); }

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...c)=>{const e=document.createElement(t);
  for(const k in a){ if(k==='class')e.className=a[k]; else if(k==='html')e.innerHTML=a[k]; else if(k.startsWith('on'))e[k]=a[k]; else e.setAttribute(k,a[k]); }
  c.flat().forEach(x=>e.append(x?.nodeType?x:document.createTextNode(x??'')));
  return e;
};

function findDoc(id){
  const u = STATE.users.find(x=>x.id===id);
  const dp = STATE.doctor_profiles.find(x=>x.user_id===id);
  if(!u) return null;
  return { id:u.id, name:u.full_name, dept:u.department, fee:dp?.consultation_fee||0, follow_up:dp?.follow_up_fee||0 };
}
function allDoctors(){ return STATE.users.filter(u=>u.is_doctor).map(u=>findDoc(u.id)); }
/* Resolve a payment_items row to its detail-table record + display info */
function resolvePaymentItem(pi){
  const t = STATE.payment_item_types.find(x=>x.id===pi.payment_type_id);
  const detail = STATE[t.detail_table]?.find(x=>x.id===pi.item_record_id);
  let ref = '';
  if(t.code==='xray')         ref = detail ? `${detail.procedure_name} → ${detail.radiology_order_id}` : '—';
  else if(t.code==='consultation') ref = detail ? `${findDoc(detail.doctor_id)?.name||'Doctor'} — ${detail.visit_type}` : '—';
  else if(t.code==='lab')     ref = detail ? `${detail.test_name} → ${detail.lab_order_id}` : '—';
  else if(t.code==='pharmacy')ref = detail ? `${detail.medicine_name} × ${detail.quantity}` : '—';
  else if(t.code==='cafeteria') ref = detail ? `${detail.item_name} × ${detail.quantity}` : '—';
  return { type:t, detail, ref };
}
function paymentItemsFor(payId){ return STATE.payment_items.filter(pi=>pi.payment_id===payId); }
function paymentsFor(patId){ return STATE.payments.filter(p=>p.patient_id===patId); }
function fmtINR(n){ return '₹'+Number(n).toLocaleString('en-IN'); }
function nowTime(){ const d=new Date(); return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }
function uid(p){ return p+Math.random().toString(36).slice(2,8); }
function initials(nm){ return nm.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase(); }

function toast(msg, type=''){
  const t = el('div',{class:'toast '+type}, type==='success'?'✓ ':type==='warn'?'⚠ ':type==='danger'?'✕ ':'• ', msg);
  $('#toasts').append(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3000);
}

function modal(title, bodyEl, footerBtns){
  const root = $('#modalRoot');
  const bg = el('div',{class:'modal-bg'});
  const m = el('div',{class:'modal'});
  const close = ()=>bg.remove();
  m.append(
    el('div',{class:'modal-h'},
      el('div',{class:'t'},title),
      el('button',{class:'btn btn-ghost', onclick:close, html:'✕'}),
    ),
    el('div',{class:'modal-b'}, bodyEl),
    el('div',{class:'modal-f'},
      ...footerBtns.map(b => el('button',{class:'btn '+(b.cls||'btn-secondary'), onclick:()=>{ if(b.onClick) b.onClick(close); else close(); }}, b.label))
    )
  );
  bg.append(m);
  bg.onclick = e=>{ if(e.target===bg) close(); };
  root.append(bg);
  return close;
}

      el('div',{class:'field'}, el('label',{},'Amount (₹)'), amtInput),
      el('div',{style:'background:var(--surface-2);padding:12px;border-radius:8px;font-size:12px'},
        `<strong>On save</strong>, this will create:<br>
         • 1 row in <code style="background:#FEF3C7;padding:1px 5px;border-radius:3px">${type.detail_table}</code><br>
         • 1 row in <code style="background:#FEF3C7;padding:1px 5px;border-radius:3px">payment_items</code> with <code>payment_type_id=${type.id}</code> linking the two`
      ),
    );
    modal('Add '+type.display+' line', body, [
      {label:'Cancel'},
      {label:'Add line', cls:'btn-primary', onClick:(close)=>{
        const ref = refInput.value || type.display;
        const amt = +amtInput.value || 0;
        if(amt<=0){ toast('Amount required','warn'); return; }
        /* draft detail-row payload — actual insert happens on Receive Payment */
        let draftDetail = {};
        if(type.code==='xray')         draftDetail = { radiology_order_id:null, procedure_name:ref, modality:'xray', rate:amt, quantity:1, discount:0 };
        else if(type.code==='consultation') draftDetail = { consultation_id:null, doctor_id:null, visit_type:'new', fee:amt, discount:0 };
        else if(type.code==='lab')     draftDetail = { lab_order_id:null, test_name:ref, sample_type:'blood', rate:amt, discount:0 };
        else if(type.code==='pharmacy')draftDetail = { pharmacy_sale_id:null, medicine_name:ref, batch_no:null, quantity:1, unit_price:amt, discount:0 };
        else                            draftDetail = { order_ref:null, item_name:ref, quantity:1, unit_price:amt };
        lines.push({type_id:type.id, type:type.code, ref, amount:amt, draftDetail});
        renderLines(); refreshTotal();
        close();
      }}
    ]);
  }
};

ROUTES['pharma:dispense'] = (c)=>{
  const active = STATE.prescriptions.filter(p=>p.status==='active');

  rx.items.forEach(i=>{
    const m = STATE.medicines.find(x=>x.name===i.medicine_name);

    total += i.unitPrice*i.qty;
  });
  c.append(
    schemaHint({
      reads:['prescriptions','prescription_items','medicines','medicine_batches','patients','users'],
      writes:['pharmacy_sales','pharmacy_sale_items','stock_movements','payments','payment_items','payment_pharmacy','prescriptions.status'],

      note:'On dispense: 1 pharmacy_sales row, N pharmacy_sale_items, N stock_movements (FEFO batch pick), 1 payment, N payment_items, N payment_pharmacy.'
    }),
    el('div',{class:'card'},
      el('div',{class:'card-h'},
        el('div',{}, el('div',{class:'card-title'}, 'Dispense — '+pat.name),
                     el('div',{class:'card-sub'}, pat.uhid+' · prescribed by '+doc.name)),
        el('span',{class:'pill pill-info'},'Active Rx'),

        el('thead',{}, el('tr',{},

            el('td',{}, el('strong',{},i.medicine_name||i.medicine)),
            el('td',{}, i.dosage),
            el('td',{}, i.duration),
            el('td',{}, i.qty),
            el('td',{}, fmtINR(i.unitPrice)),

          ))
        )
      ),
      el('div',{style:'display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding:14px;background:var(--surface-2);border-radius:8px;margin-top:12px'},
        el('div',{},'Total to collect'),
        el('div',{}, fmtINR(total)),
      ),
      el('div',{style:'background:var(--accent-light);padding:12px;border-radius:8px;margin-top:12px;font-size:12px'},
        '🔗 Will create <code>payment_pharmacy</code> rows + <code>payment_items</code> bridge linking each medicine to <code>pharmacy_sales</code>',
      ),
      el('div',{style:'display:flex;gap:8px;margin-top:14px'},
        el('button',{class:'btn btn-success', onclick:()=>{
          rx.status = 'dispensed';
          /* 1. Insert payments header */
          const pay = {id:uid('pay'), patient_id:pat.id, total_amount:total, payment_date:'2026-05-08 '+nowTime(), payment_mode:'cash', transaction_ref:'-'};
          STATE.payments.unshift(pay);
          /* 2. For each prescription item, write payment_pharmacy + payment_items + decrement stock */
          rx.items.forEach(i=>{
            i.dispensed = i.qty;
            const m = STATE.medicines.find(x=>x.name===(i.medicine_name||i.medicine));
            if(m) m.stock = Math.max(0, m.stock - i.qty);
            const detailRow = {
              id:uid('pp'), pharmacy_sale_id:null, medicine_name:i.medicine_name||i.medicine,
              batch_no:null, quantity:i.qty, unit_price:i.unitPrice, discount:0, amount:i.unitPrice*i.qty
            };
            STATE.payment_pharmacy.push(detailRow);
            STATE.payment_items.push({
              id:uid('pi'), payment_id:pay.id, payment_type_id:2,
              item_record_id:detailRow.id, amount:i.unitPrice*i.qty
            });
          });
          saveState();
          toast(`✓ Dispensed ${rx.items.length} meds · payment_pharmacy + payment_items rows written`,'success');
          navigate('dashboard');
        }}, '✓ Dispense & collect '+fmtINR(total)),

/* ============ SCHEMA HINT — shows the data lineage at top of every view ============ */
function schemaHint({reads=[], writes=[], joins=[], note=''}){
  return el('div',{class:'schema-hint'},
    el('div',{},
      el('div',{class:'lbl r'}, '◉ READ FROM'),
      el('div',{class:'desc'},
        ...reads.length ? reads.flatMap(t=>[el('code',{},t),' ']) : [el('span',{style:'opacity:.5'},'(none — write-only view)')]
      ),
    ),
    el('div',{},
      el('div',{class:'lbl w'}, '✎ WRITES TO'),
      el('div',{class:'desc'},
        ...writes.length ? writes.flatMap(t=>[el('code',{class:'write'},t),' ']) : [el('span',{style:'opacity:.5'},'(read-only view)')]
      ),
    ),
    el('div',{},
      el('div',{class:'lbl j'}, '⇄ JOINS / NOTES'),
      el('div',{class:'desc'},
        ...joins.length ? joins.flatMap(t=>[el('code',{class:'join'},t),' ']) : [],
        note ? el('div',{style:'margin-top:4px;font-style:italic;color:#94A3B8'},note) : '',
      ),
    ),
  );
}

function renderBars(data){
  const max = Math.max(...data.map(d=>d.v))||1;
  const wrap = el('div',{class:'bars'});
  data.forEach(d=>{
    wrap.append(el('div',{class:'bar', style:`height:${d.v/max*100}%`, title:d.l+': '+d.v},
      el('div',{class:'v'},d.v),
      el('div',{class:'l'},d.l),
    ));
  });
  return el('div',{style:'padding-bottom:24px'}, wrap);
}
function renderRevenueDonut(){
  const byType = {};
  PAYMENT_TYPES.forEach(t=>byType[t.code]={sum:0, type:t});
  STATE.payment_items.forEach(pi=>{
    const t = STATE.payment_item_types.find(x=>x.id===pi.payment_type_id); if(!t) return;
    if(byType[t.code]) byType[t.code].sum += pi.amount;
  });
  const total = Object.values(byType).reduce((s,b)=>s+b.sum,0)||1;
  return el('div',{style:'display:flex;align-items:center;gap:24px'},
    donutFor(byType, total),
    el('div',{style:'flex:1'},
      ...Object.values(byType).filter(b=>b.sum>0).map(b=>
        el('div',{style:'display:flex;justify-content:space-between;padding:6px 0;font-size:13px'},
          el('div',{},b.type.icon+' '+b.type.display),
          el('strong',{},fmtINR(b.sum)),
        )
      )
    )
  );
}
function donutFor(byType, total){
  const colors=['#3B82F6','#10B981','#6366F1','#F59E0B','#EC4899'];
  let pct = 0; const stops = [];
  Object.values(byType).forEach((b,i)=>{
    if(b.sum<=0) return;
    const start = pct, end = pct + (b.sum/total*100);
    stops.push(`${colors[i]} ${start}% ${end}%`);
    pct = end;
  });
  if(stops.length===0) stops.push('var(--border) 0% 100%');
  return el('div',{class:'donut',style:`background:conic-gradient(${stops.join(',')})`},
    el('div',{class:'ctr'},
      el('div',{class:'v'}, fmtINR(total)),
      el('div',{class:'l'},'Total'),
    )
  );
}

function ipDays(adm){

}
function ipChargesEstimate(adm){
  /* room charge + ward orders (approximated for demo) */
  const days = ipDays(adm);
  const bed = adm.current_bed_id;
  const rate = bed?.startsWith('ICU')?4500:bed?.startsWith('PVT')?2200:1200;
  return days*rate + 2400 + 1850; /* room + medication + consumables estimate */
}

function renderRevenueProfitBars(data){
  const max = Math.max(...data.map(d=>d.revenue));
  return el('div',{style:'display:flex;align-items:flex-end;gap:10px;height:200px;padding:0 0 30px'},
    ...data.map(d=>{
      const rH = d.revenue/max*100;
      const pH = (d.revenue-d.expenses)/max*100;
      return el('div',{style:'flex:1;position:relative;display:flex;justify-content:center;gap:2px'},
        el('div',{style:`flex:1;background:linear-gradient(180deg,#0EA5A4,#0F766E);height:${rH}%;border-radius:4px 4px 0 0;align-self:flex-end`,title:'Revenue '+fmtINR(d.revenue)}),
        el('div',{style:`flex:1;background:linear-gradient(180deg,#6366F1,#4338CA);height:${pH}%;border-radius:4px 4px 0 0;align-self:flex-end`,title:'Profit '+fmtINR(d.revenue-d.expenses)}),
        el('div',{style:'position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)'},d.month),
      );
    })
  );
}

function actorName(id){
  const u = STATE.users.find(x=>x.id===id) || PERSONAS.find(p=>p.id===id);
  return u?.full_name || u?.name || id;
}
function fmtDateLabel(dStr){
  const d = new Date(dStr+'T00:00:00');
  const now = new Date('2026-05-08T00:00:00');
  const diff = Math.round((now-d)/86400000);
  const opts = {weekday:'short', day:'numeric', month:'short', year:'numeric'};
  const label = d.toLocaleDateString('en-IN',opts);
  if(diff===0) return 'TODAY · '+label;
  if(diff===1) return 'YESTERDAY · '+label;
  if(diff<=7) return diff+' days ago · '+label;
  return label;
}

function openPatientFile(patientId){
  const p = findP(patientId); if(!p) return;
  const myPays = STATE.payments.filter(x=>x.patient_id===patientId);
  const events = STATE.patient_journey_events.filter(e=>e.patient_id===patientId).sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at));
  const myLab = STATE.lab_orders.filter(l=>l.patient_id===patientId);
  const myRad = STATE.radiology_orders.filter(r=>r.patient_id===patientId);
  const myIP = STATE.ip_admissions.filter(a=>a.patient_id===patientId);

  /* Group events by date (= visit day) */
  const byDate = {};
  events.forEach(e=>{
    const d = e.occurred_at.split(' ')[0];
    (byDate[d] = byDate[d] || []).push(e);
  });
  const dates = Object.keys(byDate).sort().reverse(); /* newest first */

  /* For each date, find a useful summary (doctor / outcome) */
  function summaryFor(evts){
    const docEvts = evts.filter(e=>e.station&&e.station.startsWith('doctor:'));
    const docId = docEvts[0]?.actor_id;
    const doc = docId?findDoc(docId):null;
    const outcomes = evts.filter(e=>['paid','rx_dispensed','lab_reported','admitted_ip','interim_billed'].includes(e.to_state));
    const final = outcomes[outcomes.length-1]?.to_state || evts[evts.length-1].to_state;
    const paidEvt = evts.find(e=>e.to_state==='paid');
    return {doc, final, amount: paidEvt?.metadata?.amount, evtCount: evts.length, range: evts[0].occurred_at.split(' ')[1]+' → '+evts[evts.length-1].occurred_at.split(' ')[1]};
  }

  const visitsWrap = el('div',{});
  function renderVisits(expandedDate){
    visitsWrap.innerHTML='';
    dates.forEach(d=>{
      const evts = byDate[d];
      const s = summaryFor(evts);
      const isOpen = d === expandedDate;
      const card = el('div',{
        style:'border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;'+(d==='2026-05-08'?'border-left:4px solid var(--primary)':''),
      });
      /* Header — clickable */
      card.append(el('div',{
        style:'padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:'+(isOpen?'var(--primary-light)':'var(--surface)'),
        onclick:()=>renderVisits(isOpen?null:d),
      },
        el('div',{style:'flex:1'},
          el('div',{style:'font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.2px'}, fmtDateLabel(d)),
          el('div',{style:'font-weight:700;font-size:15px;margin-top:2px'},
            s.doc ? s.doc.name+' · '+s.doc.dept : 'No doctor in journey',
          ),
          el('div',{style:'font-size:12px;color:var(--muted);margin-top:2px'},
            `${s.evtCount} event(s) · ${s.range} · final: ${s.final}` + (s.amount?` · ${fmtINR(s.amount)}`:''),
          ),
        ),
        el('div',{style:'font-size:18px;color:var(--muted)'}, isOpen?'▼':'▶'),
      ));
      /* Expanded — full timeline for this date + all attached records */
      if(isOpen){
        /* Collect attached records dated within this day */
        const dayLabs = STATE.lab_orders.filter(lo=> (lo.ordered_at||'').startsWith(d) && lo.patient_id===patientId);
        const dayRads = STATE.radiology_orders.filter(ro=> (ro.ordered_at||'').startsWith(d) && ro.patient_id===patientId);
        const dayRx   = STATE.prescriptions.filter(rx=> (rx.created_at||'').startsWith(d) && rx.patient_id===patientId);
        const dayDS   = STATE.discharge_summaries.filter(ds=> (ds.created_at||'').startsWith(d) && ds.patient_id===patientId);
        const dayPays = STATE.payments.filter(py=> (py.payment_date||'').startsWith(d) && py.patient_id===patientId);

/* ============================================================
   LAB RESULTS — FIXED with reference ranges + auto-flag
   ============================================================ */
ROUTES['lab:results'] = (c)=>{
  const pending = STATE.lab_orders.filter(o=>o.status==='sample_collected');
  if(!pending.length){ c.append(el('div',{class:'empty'},el('div',{class:'e-ico'},'✓'),'No samples awaiting result entry')); return; }
  const lo = pending[0];
  const pat = findP(lo.patient_id);
  const tests = STATE.lab_tests.slice(0,6); /* simulate panel */
  const inputs = {};

  function flagFor(t,val,gender){
    if(val===''||val==null||isNaN(+val)) return null;
    const min = gender==='F'?t.ref_min_f:t.ref_min_m;
    const max = gender==='F'?t.ref_max_f:t.ref_max_m;
    const v = +val;
    if(v < min) return 'low';
    if(v > max) return 'high';
    return 'normal';
  }
  function refresh(){
    tests.forEach(t=>{
      const f = flagFor(t, inputs[t.id]?.value, pat.gender);
      const flagEl = document.getElementById('flag-'+t.id);
      if(flagEl){
        flagEl.className = 'pill pill-'+(f==='high'?'danger':f==='low'?'warn':f==='normal'?'success':'grey');
        flagEl.textContent = f||'—';
      }
    });
  }

  c.append(
    schemaHint({
      reads:['lab_orders','lab_order_items','lab_tests (reference ranges)','patients'],
      writes:['lab_results','lab_orders.status','alerts (if critical)'],
      joins:['lab_results.lab_order_item_id → lab_order_items · ⨝ lab_tests for ref range'],
      note:'Auto-flag on entry: < ref_min → low · > ref_max → high · within → normal. Critical (>2× max) writes alerts row.'
    }),
    el('div',{class:'card'},
      el('div',{class:'card-h'},
        el('div',{},
          el('div',{class:'card-title'}, 'Result entry — '+lo.test),
          el('div',{class:'card-sub'}, pat.name+' · '+pat.uhid+' · '+pat.gender+' · sample collected '+(lo.collected_at||'today')),
        ),
        el('span',{class:'pill pill-warn'},'In progress'),
      ),
      el('table',{style:'margin-top:14px'},
        el('thead',{},el('tr',{},el('th',{},'Test'),el('th',{},'Value'),el('th',{},'Unit'),el('th',{},'Reference range'),el('th',{},'Flag'))),
        el('tbody',{},
          ...tests.map(t=>{
            const inp = el('input',{type:'number',step:'0.1',style:'width:100px;padding:6px 10px;border:1px solid var(--border);border-radius:6px',oninput:refresh});
            inputs[t.id] = inp;
            const min = pat.gender==='F'?t.ref_min_f:t.ref_min_m;
            const max = pat.gender==='F'?t.ref_max_f:t.ref_max_m;
            return el('tr',{},
              el('td',{},el('strong',{},t.name)),
              el('td',{},inp),
              el('td',{},t.unit),
              el('td',{style:'font-size:12px;color:var(--muted);font-family:monospace'},`${min} – ${max}`),
              el('td',{},el('span',{id:'flag-'+t.id,class:'pill pill-grey'},'—')),
            );
          })
        )
      ),
      el('div',{style:'background:var(--accent-light);padding:12px;border-radius:8px;margin-top:14px;font-size:12px'},
        '🔔 Any value flagged <strong>critical</strong> (e.g., >2× upper bound) will write an entry to the <code>alerts</code> table for the ordering doctor.'
      ),
      el('button',{class:'btn btn-success btn-lg',style:'width:100%;margin-top:14px;justify-content:center',onclick:()=>{
        let critical = 0;
        tests.forEach(t=>{
          const v = inputs[t.id].value;
          if(v==='') return;
          const f = flagFor(t, v, pat.gender);
          STATE.lab_results.push({id:uid('lr'), lab_order_id:lo.id, lab_test_id:t.id, value:+v, value_text:null, unit:t.unit, flag:f, verified_by:currentUser.id, reported_at:nowTime()});
          /* Critical = >2x max */
          const max = pat.gender==='F'?t.ref_max_f:t.ref_max_m;
          if(f==='high' && +v > max*1.5){
            critical++;
            STATE.alerts.unshift({id:uid('al'),severity:'critical',title:'Critical lab — '+t.name,body:`${pat.name}: ${v} ${t.unit} (ref ${max})`,target_role:[lo.doctor_id,'adm1'],created_at:'2026-05-08 '+nowTime(),read:false});
          }
        });
        lo.status='reported';
        STATE.patient_journey_events.push({id:uid('pje'),patient_id:pat.id,from_state:'lab_pending',to_state:'lab_reported',actor_id:currentUser.id,station:'lab',occurred_at:'2026-05-08 '+nowTime(),metadata:{lab_order:lo.id}});
        saveState();
        toast(`✓ Result reported${critical?' · '+critical+' CRITICAL alert(s) raised':''}`,critical?'danger':'success');
        navigate('dashboard');
      }},'✓ Verify & report'),
    )
  );
};

/* ============================================================
   ADMIN — Cash session with denomination breakdown
   ============================================================ */
ROUTES['admin:cashier'] = (c)=>{
  const sess = STATE.cash_sessions[0];
  const todayPays = STATE.payments.filter(p=>p.payment_date.startsWith('2026-05-08'));
  const expCash = todayPays.filter(p=>p.payment_mode==='cash').reduce((s,p)=>s+p.total_amount,0) + sess.opening_float;
  const upi = todayPays.filter(p=>p.payment_mode==='upi').reduce((s,p)=>s+p.total_amount,0);
  const card = todayPays.filter(p=>p.payment_mode==='card').reduce((s,p)=>s+p.total_amount,0);
  const denoms = [2000,500,200,100,50,20,10,5];
  const inputs = {};
  function compute(){
    const counted = denoms.reduce((s,d)=>s+(parseInt(inputs[d]?.value)||0)*d,0);
    $('#counted-total').textContent = fmtINR(counted);
    $('#variance').textContent = fmtINR(counted - expCash);
    $('#variance').style.color = counted - expCash === 0 ? 'var(--success)' : 'var(--danger)';
  }
  c.append(
    schemaHint({
      reads:['payments','business_sessions','session_movements','cash_counters'],
      writes:['business_sessions.counted_cash','business_sessions.variance','business_sessions.denomination_breakdown (jsonb)','session_closure_audit'],
      joins:['payments WHERE session_id=current ⨝ business_sessions'],
      note:'Closure persists denominations as jsonb {2000:5,500:20…}. Variance ≠ 0 requires variance_reason text + manager approval.'
    }),
    el('div',{class:'grid-4'},
      stat('Opening float', fmtINR(sess.opening_float), '09:00 AM', '🏦'),

function openMergeFlow(){
  const tempPats = STATE.patients.filter(p=>p.uhid.startsWith('TEMP-'));
  const realPats = STATE.patients.filter(p=>!p.uhid.startsWith('TEMP-')&&!p.merged_to_id);
  if(tempPats.length===0){
    modal('Merge patients', el('div',{class:'empty'},'No TEMP-UHID patients to merge.'),[{label:'Close'}]);
    return;
  }
  const srcSel = el('select',{style:'width:100%;padding:10px;border:1px solid var(--border);border-radius:8px'});
  tempPats.forEach(p=>srcSel.append(el('option',{value:p.id},`${p.uhid} — ${p.name}`)));
  const tgtSel = el('select',{style:'width:100%;padding:10px;border:1px solid var(--border);border-radius:8px'});
  realPats.forEach(p=>tgtSel.append(el('option',{value:p.id},`${p.uhid} — ${p.name}`)));
  const reasonInp = el('textarea',{placeholder:'Why are these the same person? (e.g. matched mobile number, family confirmed identity)'});
  modal('Merge two patient records', el('div',{},
    el('div',{class:'mini-hint',style:'margin-bottom:14px'},
      el('span',{class:'tag w'},'W'),' ',el('code',{},'patient_merges'),' ',
      el('span',{class:'tag w'},'W'),' ',el('code',{},'op_visits.patient_id, payments.patient_id, ... (all child rows repointed)')
    ),
    el('div',{class:'field'},el('label',{},'Source (TEMP-UHID — will be marked merged)'),srcSel),
    el('div',{class:'field'},el('label',{},'Target (permanent UHID — surviving record)'),tgtSel),
    el('div',{class:'field'},el('label',{},'Reason / verification'),reasonInp),
    el('div',{style:'background:#FEF3C7;padding:10px;border-radius:6px;font-size:12px'},
      '⚠ This will repoint ALL child rows (op_visits, payments, lab orders, journey events, etc.) from source to target. Audit row stored in patient_merges.'
    ),
  ),[
    {label:'Cancel'},
    {label:'Confirm merge', cls:'btn-danger', onClick:(close)=>{
      if(!reasonInp.value.trim()){ toast('Reason required','warn'); return; }
      const srcId = srcSel.value, tgtId = tgtSel.value;
      const counts = {
        op_visits: STATE.op_visits.filter(v=>v.patient_id===srcId).length,
        payments: STATE.payments.filter(p=>p.patient_id===srcId).length,
        patient_journey_events: STATE.patient_journey_events.filter(e=>e.patient_id===srcId).length,
      };
      /* repoint child rows */
      STATE.op_visits.forEach(v=>{ if(v.patient_id===srcId) v.patient_id = tgtId; });
      STATE.payments.forEach(p=>{ if(p.patient_id===srcId) p.patient_id = tgtId; });
      STATE.patient_journey_events.forEach(e=>{ if(e.patient_id===srcId) e.patient_id = tgtId; });
      STATE.lab_orders.forEach(l=>{ if(l.patient_id===srcId) l.patient_id = tgtId; });
      STATE.radiology_orders.forEach(r=>{ if(r.patient_id===srcId) r.patient_id = tgtId; });
      STATE.prescriptions.forEach(rx=>{ if(rx.patient_id===srcId) rx.patient_id = tgtId; });
      /* mark source as merged */
      const src = STATE.patients.find(p=>p.id===srcId);
      if(src){ src.merged_to_id = tgtId; src.is_active = false; }
      /* audit */
      STATE.patient_merges.push({
        id:uid('pm'), tenant_id:'KH', source_patient_id:srcId, target_patient_id:tgtId,
        reason:reasonInp.value, rows_repointed:counts,
        merged_by:currentUser.id, merged_at:'2026-05-09 '+nowTime(),
        unmerged_at:null, unmerged_by:null, unmerge_reason:null
      });
      saveState();
      toast(`✓ Merged · ${Object.values(counts).reduce((a,b)=>a+b,0)} child rows repointed`,'success');
      close(); renderRoute();
    }}
  ]);
}
