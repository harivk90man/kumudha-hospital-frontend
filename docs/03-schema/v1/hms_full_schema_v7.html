// Brief about each table — its purpose in one line. Rendered in each card under the table header.
const TABLE_DESC = {
  // Core / Platform
  'tenants': 'Hospital identity — top-level organization. Every other row partitions on tenant_id.',
  'users': 'All staff accounts — doctors, nurses, receptionists, pharmacists, admins. One row per employee.',
  'departments': 'Functional units (Ortho, Derma, Lab, Pharmacy…). Drives routing, fees, and reporting splits.',
  'doctor_profiles': 'Doctor-only attributes — specialization, fees, slot duration, signature. Extends users for clinical staff.',
  'roles': 'Named role definitions (admin, receptionist, doctor…) used for permission grouping.',
  'user_roles': 'Many-to-many user↔role assignments. A user can hold multiple roles with one default landing role.',
  'permissions': 'Atomic permission keys (e.g. pharmacy.stock.edit). The catalog of every gated action.',
  'role_permissions': 'Grants — which permissions a role carries. Joining table for role↔permission.',
  'user_sessions': 'Active login sessions. Token hash, device, expiry — used by the auth middleware.',
  'audit_logs': 'Append-only log of every sensitive write. Captures old/new values, user, IP for compliance.',
  'domain_events': 'Append-only event stream — BillFinalized, AdmissionCreated… Subscribers fan out async work.',
  'notifications': 'In-app alerts to users or roles. Supports priority, ACK SLA, and an escalation chain.',
  'notification_acknowledgments': 'Records who ACKed a high-priority alert and whether the ACK met its SLA.',
  'system_config': 'Tenant-scoped key/value settings. Toggleable behavior without a code deploy.',
  'user_preferences': 'Per-user UI settings — theme, language, default landing role/path, notification channels.',
  'uhid_sequences': 'Per-tenant, per-year UHID counter. Source of truth for the next sequence number.',
  'patients': 'Master patient identity. UHID, demographics, allergies — referenced by every clinical & billing row.',
  'patient_merges': 'Audit of duplicate-record consolidations. Source patient is hidden, child rows repointed to target.',
  'patient_states': 'Catalog of every state in the patient journey (100..710). Drives the state machine and analytics.',
  'stations': 'Physical service points (front desk, billing, vitals, doctor rooms). Patients move between stations.',
  'document_templates': 'Reusable templates — consultation notes, discharge summaries, prescriptions. Versioned per edit.',
  'file_attachments': 'All uploaded files (scans, reports, photos) attached to a patient and a source module row.',

  // Scheduling
  'appointment_slots': 'Bookable time slots per doctor per date. Status flips to booked once reserved.',
  'appointments': "A patient's reservation for a future visit. Source (walk-in/phone/online) and lifecycle status.",

  // Patient Encounters
  'op_visits': 'One outpatient visit. OP number, doctor, chief complaint, current state — entry point for OP workflow.',
  'patient_queue': 'Live queue rows — where every active patient is right now. Drives the queue dashboard.',
  'tokens': 'Token-issuance ledger. Display number (D-04), service, sequence — never reused after cancellation.',
  'patient_journey_events': 'Append-only state-transition log per patient. Source of truth for journey analytics.',
  'ip_admissions': 'One IP stay. IP number, bed, admit/discharge dates, state — ties together the inpatient stay.',
  'mlc_records': 'Medico-legal case file. Incident details, police info, closure status — required for RTA/assault.',

  // Clinical
  'consultations': 'One doctor encounter — complaint, exam, diagnoses, advice, next action. Anchor of the clinical record.',
  'diagnosis_templates': 'Pre-built diagnosis bundles — exam, common meds, common tests. Speeds up frequent presentations.',
  'prescriptions': 'Prescription header per consultation. Tracks dispensing status across pharmacy.',
  'prescription_items': 'One drug per row — dosage, frequency, duration, qty prescribed vs dispensed.',
  'doctor_recommendations': 'Doctor-issued referrals — physio, surgery, admission, follow-up. Polymorphic to the target.',
  'consultation_drafts': 'Auto-saved in-progress consultation data. Restores work if the browser/session is lost.',

  // Billing
  'services': 'Service catalog — consultations, procedures, room charges. Pricing source for invoice items.',
  'invoices': 'One bill. Subtotal, discounts, taxes, payment status. OP / IP_INTERIM / IP_FINAL / PHARMACY / LAB_DIRECT.',
  'invoice_items': 'Line items on a bill — consultation, drug, lab, room, procedure. Carries the CGST/SGST/IGST split.',
  'payments': 'Money-movement event — cash, card, UPI, cheque, insurance. Direction in (collection) or out (refund).',
  'payees': 'Who paid or received money — patient, walk-in, vendor, employee, insurance. Decouples payment from UHID.',
  'payment_allocations': 'How a payment was split across invoices, advances, refunds. One payment → many allocations.',
  'service_billing_policies': 'Per-service-type rules — pre-pay, post-pay, advance %, emergency override.',
  'credit_notes': 'Refund credits issued (returns, cancellations). Apply against future invoices or refund as cash.',
  'payment_item_types': 'Discriminator catalog for polymorphic payment lines (xray, pharmacy, consultation, lab, cafeteria).',
  'payment_items': 'Bridge between a payment and its source detail row. Supports multi-service single payments.',
  'payment_xray': 'Per-X-ray line on a payment — procedure, modality, rate, discount, amount.',
  'payment_pharmacy': 'Per-medicine line on a payment — name, batch, qty, unit price, discount, amount.',
  'payment_consultation': 'Per-consultation line on a payment — doctor, visit type (new/follow-up), fee.',
  'payment_lab': 'Per-test line on a payment — test name, sample type, rate, discount, amount.',
  'payment_cafeteria': 'Per-cafeteria line on a payment — external POS reference, item, qty, price.',
  'service_price_history': 'Effective-dated price audit for services. Powers re-billing at historical rates.',

  // Cash & Closure

  'session_movements': 'Non-payment cash movements during a session — expense payouts, refunds, deposits, handovers.',

  // Inpatient

  'beds': 'Individual bed positions inside rooms. Status drives the bed-board and assignment.',

  'ward_orders': 'Doctor-issued ward instructions — meds, diet, procedure, monitoring, investigation.',
  'interim_bills': 'Mid-stay snapshot bills issued before discharge. Used for attender pharmacy or mid-stay settlements.',

// Strip the trailing "🆕v8" / "🆕v7" marker some table names carry, for clean lookup.
function tableDescKey(name){return (name||'').replace(/\s*🆕v\d+\s*$/, '').trim();}
function tableDesc(name){return TABLE_DESC[tableDescKey(name)] || '';}

let cur=0,light=false;

function dot(f){
  if(f.pk)return'<div class="dot dpk"></div>';
  if(f.fk)return'<div class="dot dfk"></div>';
  if(f.uk)return'<div class="dot duk"></div>';
  return'<div class="dot dnl"></div>';
}
function bgs(f){
  const b=[];
  if(f.pk)b.push('<span class="bg bpk">PK</span>');
  if(f.fk)b.push(`<span class="bg bfk">→ ${f.fk}</span>`);
  if(f.uk&&!f.pk)b.push('<span class="bg buk">UQ</span>');
  if(f.nl)b.push('<span class="bg bnl">null</span>');
  if(f.nw)b.push('<span class="bg bnew">NEW</span>');
  if(f.ud)b.push('<span class="bg bupd">UPDATED</span>');
  return b.join('');
}

// Auto-generate description if not curated
function autoDesc(tableName, field) {
  const n = field.n;
  const t = (field.t || '').toLowerCase();
  if (field.pk) return `Primary key for the ${tableName} table. Synthetic UUID — never shown in UI, only used for joins.`;
  if (n === 'tenant_id') return 'Multi-tenancy partition. Every row carries a tenant_id from day 1 — even single-tenant deployments — so SaaS expansion requires zero migration.';
  if (n === 'created_at') return 'Audit timestamp set on row creation. Never updated.';
  if (n === 'updated_at') return 'Last modification time. Auto-updated by trigger on every UPDATE.';
  if (n === 'created_by') return 'User who created this row. FK to users.id. Required for audit.';
  if (n.endsWith('_at') && t.includes('timestamp')) return 'Timestamp recording when this event occurred. Indexed for time-window queries.';
  if (field.fk) return `Foreign key to the ${field.fk} table. ${field.nl ? 'Nullable — optional relationship.' : 'Required relationship.'}`;
  if (n === 'is_active') return 'Soft-delete flag. False rows are excluded from default queries but retained for audit.';
  if (n.startsWith('is_')) return `Boolean flag — ${n.slice(3).replace(/_/g, ' ')}.`;
  if (t.includes('jsonb')) return 'JSONB structured field — see type column for shape. Indexed via GIN if queried frequently.';
  if (t.includes('text')) return 'Free-form text. ' + (field.nl ? 'Optional.' : 'Required.');
  return 'Field on the ' + tableName + ' table.';
}

// Parse allowed values from the type string ("varchar · 'a'|'b'|'c'")
function parseValues(typeStr) {
  if (!typeStr) return [];
  // match 'value' tokens separated by |
  const after = typeStr.split('·')[1] || typeStr;
  const matches = after.match(/'([^']+)'/g);
  if (!matches || matches.length < 2) return [];
  return matches.map(m => m.replace(/'/g, ''));
}

function parseConstraints(field) {
  const c = [];
  if (field.pk) c.push(['Primary key', 'PK']);
  if (field.uk) c.push(['Unique', 'UK']);
  if (field.fk) c.push(['Foreign key', '→ ' + field.fk]);
  if (field.nl) c.push(['Nullable', 'YES']);
  else if (!field.pk) c.push(['Nullable', 'NO']);
  // detect DEFAULT in type string
  const defMatch = (field.t || '').match(/DEFAULT\s+(\S+)/i);
  if (defMatch) c.push(['Default', defMatch[1]]);
  return c;
}

function pageUsageList(tableName) {
  return TABLE_USAGE[tableName] || [];
}

// Open drawer
function openFieldDrawer(tableName, fieldIdx) {
  const table = M.flatMap(m => m.tb).find(t => t.n === tableName);
  if (!table) return;
  const f = table.f[fieldIdx];
  if (!f) return;

  const key = tableName + '.' + f.n;
  const desc = FIELD_DESC[key] || autoDesc(tableName, f);
  const vals = parseValues(f.t);
  const constraints = parseConstraints(f);
  const pages = pageUsageList(tableName);

  const tags = [];
  if (f.pk) tags.push(['PK', 'pk']);
  if (f.fk) tags.push(['FK → ' + f.fk, 'fk']);
  if (f.uk) tags.push(['UNIQUE', 'uk']);
  if (f.nl) tags.push(['NULLABLE', 'nl']);
  if (f.nw) tags.push(['NEW IN v7.1', 'new']);
  if (f.ud) tags.push(['UPDATED', 'upd']);

  document.getElementById('drHead').innerHTML = `
    <div class="dr-eyebrow">Field detail</div>
    <div class="dr-title"><span class="dr-table">${tableName}</span><span class="dr-dot">.</span><span class="dr-field">${f.n}</span></div>
    <div class="dr-tags">${tags.map(([txt,cls]) => `<span class="dr-tag dr-tag-${cls}">${txt}</span>`).join('')}</div>
  `;

  document.getElementById('drBody').innerHTML = `
    <div class="dr-section">
      <div class="dr-section-label">Type</div>
      <div class="dr-typebox">${f.t || '—'}</div>
    </div>

    <div class="dr-section">
      <div class="dr-section-label">Description</div>
      <div class="dr-desc">${desc}</div>
    </div>

    ${vals.length > 0 ? `
      <div class="dr-section">
        <div class="dr-section-label">Allowed values · ${vals.length}</div>
        <div class="dr-vals">
          ${vals.map((v,i) => `<div class="dr-val"><span>${v}</span><span class="dr-val-tag">option ${i+1}</span></div>`).join('')}
        </div>
      </div>
    ` : ''}

    ${constraints.length > 0 ? `
      <div class="dr-section">
        <div class="dr-section-label">Constraints</div>
        <div class="dr-meta-grid">
          ${constraints.map(([k,v]) => `<div class="dr-meta-k">${k}</div><div class="dr-meta-v">${v}</div>`).join('')}
        </div>
      </div>
    ` : ''}

    <div class="dr-section">
      <div class="dr-section-label">Where it's used · ${pages.length} screen${pages.length !== 1 ? 's' : ''}</div>
      ${pages.length === 0 ? `<div class="dr-empty">Not yet mapped to specific screens. Pages that touch the ${tableName} table will reference this field.</div>` :
        pages.map(p => `
          <div class="dr-page">
            <div style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1">
              <span class="dr-page-name">${p.page}</span>
              <span class="dr-page-role">${p.role}</span>
            </div>
            <span class="dr-page-op ${p.op.includes('WRITE') ? 'write' : 'read'}">${p.op}</span>
          </div>
        `).join('')
      }
    </div>
  `;

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'false');
  document.getElementById('drOverlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  document.getElementById('drOverlay').classList.remove('open');
}

document.getElementById('drClose').addEventListener('click', closeDrawer);
document.getElementById('drOverlay').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

function buildTotals(){
  const el=document.getElementById('totals');
  let totalT=0,totalF=0,totalNewT=0,totalNewF=0,totalUpdT=0,totalUpdF=0;
  M.forEach(m=>{
    m.tb.forEach(t=>{
      totalT++;
      if(t.nw)totalNewT++;
      else if(t.ud)totalUpdT++;
      t.f.forEach(f=>{
        totalF++;
        if(f.nw)totalNewF++;
        else if(f.ud)totalUpdF++;
      });
    });
  });
  let changeChips='';
  if(totalNewT>0)changeChips+=`<span class="chip chip-new" style="font-size:9.5px">+${totalNewT} new table${totalNewT>1?'s':''}</span>`;
  if(totalNewF>0)changeChips+=`<span class="chip chip-new" style="font-size:9.5px">+${totalNewF} new field${totalNewF>1?'s':''}</span>`;
  if(totalUpdT>0)changeChips+=`<span class="chip chip-upd" style="font-size:9.5px">${totalUpdT} updated table${totalUpdT>1?'s':''}</span>`;
  el.innerHTML=`
    <span class="totals-label">HMS Schema</span>
    <div class="totals-divider"></div>
    <div class="totals-stat"><span class="totals-num">${M.length}</span><span class="totals-cap">modules</span></div>
    <div class="totals-stat"><span class="totals-num">${totalT}</span><span class="totals-cap">tables</span></div>
    <div class="totals-stat"><span class="totals-num">${totalF}</span><span class="totals-cap">fields</span></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-left:4px">${changeChips}</div>
    <span class="totals-version">v7.1</span>
  `;
}

function buildTabs(){
  const el=document.getElementById('tabbar');
  el.innerHTML='';
  M.forEach((m,i)=>{
    const t=document.createElement('button');
    t.className='tab'+(i===cur?' on':'')+(m.p2?' p2':'');
    t.style.color=i===cur?m.cl:'';
    t.style.borderColor=i===cur?m.cl+'33':'transparent';
    if(i===cur)t.style.background=light?'#ffffff':'#181820';
    t.textContent=m.nm;
    t.onclick=()=>{cur=i;buildTabs();buildBody();};
    el.appendChild(t);
  });
}

function buildBody(){
  const m=M[cur];
  const hdrBg=light?m.lbg:m.bg;
  const totalF=m.tb.reduce((s,t)=>s+t.f.length,0);
  const newF=m.tb.reduce((s,t)=>s+t.f.filter(f=>f.nw).length,0);
  const updF=m.tb.reduce((s,t)=>s+t.f.filter(f=>f.ud).length,0);
  const newT=m.tb.filter(t=>t.nw).length;
  const updT=m.tb.filter(t=>t.ud&&!t.nw).length;

  let chips='';
  if(newT>0)chips+=`<span class="chip chip-new">${newT} new table${newT>1?'s':''}</span>`;
  if(updT>0)chips+=`<span class="chip chip-upd">${updT} updated table${updT>1?'s':''}</span>`;
  if(newF>0)chips+=`<span class="chip chip-new">${newF} new field${newF>1?'s':''}</span>`;
  if(updF>0)chips+=`<span class="chip chip-upd">${updF} updated</span>`;

  const cards=m.tb.map(t=>{
    const changed=t.f.filter(f=>f.nw||f.ud).length;
    const isNewTable=t.nw;
    const isUpdatedTable=t.ud&&!t.nw;
    let hdExtras='';
    if(isNewTable)hdExtras+='<span class="ntag ntag-new">NEW TABLE</span>';
    else if(isUpdatedTable)hdExtras+='<span class="ntag ntag-upd">UPDATED</span>';
    else if(changed>0)hdExtras+=`<span class="ntag ntag-new">${changed} changed</span>`;
    const desc=tableDesc(t.n);
    const descBlock=desc?`<div class="tdesc">${desc}</div>`:'';
    const hd=`<div class="chd" style="background:${hdrBg}">${hdExtras}<span class="tn">${t.n}</span><span class="tc">${t.f.length} fields</span></div>${descBlock}`;
    const rows=t.f.map((f,i)=>`<div class="row${f.nw?' nw':f.ud?' ud':''}" data-tbl="${t.n}" data-fld="${i}">${dot(f)}<span class="fn">${f.n}</span><span class="ft">${f.t||''}</span>${bgs(f)}</div>`).join('');
    return`<div class="card">${hd}${rows}</div>`;
  }).join('');

  const p2Banner = m.p2 ? `<div class="p2-banner"><strong>Phase 2</strong>Out of scope for v1 — implementation deferred. Tables shown here for reference and forward planning.</div>` : '';
  document.getElementById('body').innerHTML=`
    ${p2Banner}
    <div class="sbar">
      <div><div class="sn" style="color:${m.cl}">${m.tb.length}</div><div class="sl">TABLES</div></div>
      <div><div class="sn" style="color:${m.cl}">${totalF}</div><div class="sl">FIELDS</div></div>
      <div style="margin-left:4px;font-size:10px;color:var(--t3);align-self:center;font-family:sans-serif">${m.nm}</div>
      <div class="chips">${chips}</div>
    </div>
    <div class="grid">${cards}</div>`;
  // Wire field-row clicks for the help drawer
  document.querySelectorAll('#body .row[data-tbl]').forEach(el => {
    el.addEventListener('click', () => {
      openFieldDrawer(el.dataset.tbl, parseInt(el.dataset.fld));
    });
  });
}

function toggleTheme(){
  light=!light;
  document.getElementById('root').classList.toggle('L',light);
  document.getElementById('togi').textContent=light?'☾':'☀';
  buildTotals();buildTabs();buildBody();
}

buildTotals();buildTabs();buildBody();
