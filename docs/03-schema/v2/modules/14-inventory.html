<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventory — HMS Schema v8</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="../shared/manifest.js"></script>
  <script src="../shared/catalog.js"></script>
  <script src="../shared/renderer.js"></script>
  <script>
  // ─── EDIT BELOW ONLY. Do not touch HTML/script tags. ────────────────────
  const MODULE = {
    id: 'inventory',
    name: 'Inventory',
    color: '#B86F8E',
    bg: '#22141A',
    lbg: '#F5E5EC',
    features: ['vendor', 'catalog', 'stock', 'procurement', 'movement', 'narcotic'],
    tables: [
      { n:'vendors', feature:'vendor', desc:'Pharma supplier directory — contact, GST, payment terms, drug licence, narcotic-supplier flag.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants',nw:1},
          {n:'vendor_code',t:'varchar',uk:1,nw:1},
          {n:'vendor_name',t:'varchar'},
          {n:'contact_person',t:'varchar',nl:1},
          {n:'mobile',t:'varchar'},
          {n:'email',t:'varchar',nl:1,nw:1},
          {n:'address',t:'text',nl:1},
          {n:'gstin',t:'varchar',nl:1,nw:1},
          {n:'pan',t:'varchar',nl:1,nw:1},
          {n:'drug_licence_number',t:'varchar',nl:1,nw:1},
          {n:'payment_terms_days',t:'int DEFAULT 30',nw:1},
          {n:'is_narcotic_supplier',t:'boolean DEFAULT FALSE',nw:1},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'medicines', feature:'catalog', desc:'Drug master — name, schedule, form, strength, GST, reorder level, narcotic flag, drug_class for allergy alerting.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants',nw:1},
          {n:'medicine_code',t:'varchar',uk:1,nw:1},
          {n:'medicine_name',t:'varchar'},
          {n:'generic_name',t:'varchar',nl:1},
          {n:'brand_name',t:'varchar',nl:1},
          {n:'manufacturer',t:'varchar',nl:1},
          {n:'category',t:'varchar'},
          {n:'drug_schedule',t:"varchar · 'H'|'H1'|'X'|'G'|'OTC'",nl:1},
          {n:'is_narcotic',t:'boolean DEFAULT FALSE · NDPS Act'},
          {n:'drug_class',t:'varchar · matches allergies_lookup.drug_class_code',nl:1,nw:1},
          {n:'form',t:"varchar · 'tablet'|'capsule'|'syrup'|'injection'|'cream'|'ointment'|'drops'|'inhaler'|'patch'|'suppository'|'powder'"},
          {n:'strength',t:'varchar',nl:1},
          {n:'unit',t:'varchar'},
          {n:'pack_size',t:'int',nl:1,nw:1},
          {n:'storage_temp',t:"varchar · 'room'|'refrigerated'|'frozen'|'controlled'",nl:1,nw:1},
          {n:'hsn_code',t:'varchar',nl:1},
          {n:'gst_pct',t:'decimal DEFAULT 12'},
          {n:'requires_prescription',t:'boolean'},
          {n:'reorder_level',t:'int'},
          {n:'max_stock_level',t:'int',nl:1,nw:1},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'medicine_batches', feature:'stock', desc:'Per-batch stock — batch no, expiry, MRP, qty available. The inventory unit-of-account. FEFO pick. Block expired/recalled.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'medicine_id',t:'uuid',fk:'medicines'},
          {n:'batch_number',t:'varchar'},
          {n:'mfg_date',t:'date',nl:1},
          {n:'expiry_date',t:'date'},
          {n:'purchase_price',t:'decimal'},
          {n:'mrp_at_purchase',t:'decimal'},
          {n:'selling_price',t:'decimal'},
          {n:'quantity_received',t:'int'},
          {n:'quantity_available',t:'int · auto-decrement by trigger'},
          {n:'vendor_id',t:'uuid',fk:'vendors'},
          {n:'po_id',t:'uuid',fk:'purchase_orders',nl:1},
          {n:'received_date',t:'date'},
          {n:'is_blocked',t:'boolean DEFAULT FALSE',nw:1},
          {n:'blocked_reason',t:"varchar · 'expired'|'recall'|'damaged'",nl:1,nw:1},
          {n:'version',t:'int DEFAULT 0 · optimistic lock'},
        ]},
      { n:'purchase_orders', feature:'procurement', desc:'PO header to a vendor — status (draft/sent/received…), totals, Layer 2 approver. Includes-narcotics flag.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants',nw:1},
          {n:'po_number',t:'varchar',uk:1},
          {n:'vendor_id',t:'uuid',fk:'vendors'},
          {n:'expected_date',t:'date',nl:1},
          {n:'status',t:"varchar · 'draft'|'pending_approval'|'approved'|'sent'|'partially_received'|'received'|'cancelled'|'rejected'"},
          {n:'total_amount',t:'decimal'},
          {n:'includes_narcotics',t:'boolean DEFAULT FALSE',nw:1},
          {n:'ordered_by',t:'uuid',fk:'users'},
          {n:'approval_status',t:"varchar · 'pending'|'approved'|'rejected'",nw:1},
          {n:'approved_by',t:'uuid',fk:'users',nl:1},
          {n:'approved_at',t:'timestamptz',nl:1,nw:1},
          {n:'rejection_reason',t:'text',nl:1,nw:1},
          {n:'ordered_at',t:'timestamptz'},
          {n:'received_at',t:'timestamptz',nl:1},
        ]},
      { n:'purchase_order_items', feature:'procurement', desc:'Lines on a PO — medicine, qty ordered/received, price, GST split.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'purchase_order_id',t:'uuid',fk:'purchase_orders'},
          {n:'medicine_id',t:'uuid',fk:'medicines'},
          {n:'quantity_ordered',t:'int'},
          {n:'quantity_received',t:'int'},
          {n:'unit_price',t:'decimal'},
          {n:'cgst_pct',t:'decimal DEFAULT 0'},
          {n:'cgst_amount',t:'decimal DEFAULT 0',nw:1},
          {n:'sgst_pct',t:'decimal DEFAULT 0'},
          {n:'sgst_amount',t:'decimal DEFAULT 0',nw:1},
          {n:'igst_pct',t:'decimal DEFAULT 0'},
          {n:'igst_amount',t:'decimal DEFAULT 0',nw:1},
          {n:'total_price',t:'decimal'},
        ]},
      { n:'stock_movements', feature:'movement', desc:'Append-only stock change log — purchase_in, sale_out, return, writeoff, surgery/ward use. Separate-column FKs to source rows.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'medicine_batch_id',t:'uuid',fk:'medicine_batches'},
          {n:'movement_type',t:"varchar · 'purchase_in'|'sale_out'|'return_in'|'return_writeoff'|'adjustment'|'expiry_writeoff'|'surgery_use'|'ward_use'|'transfer_in'|'transfer_out'"},
          {n:'quantity',t:'int · signed'},
          {n:'balance_after',t:'int · snapshot'},
          {n:'purchase_order_item_id',t:'uuid',fk:'purchase_order_items',nl:1,nw:1},
          {n:'pharmacy_sale_item_id',t:'uuid',fk:'pharmacy_sale_items',nl:1,nw:1},
          {n:'pharmacy_return_item_id',t:'uuid',fk:'pharmacy_return_items',nl:1,nw:1},
          {n:'transfer_counterpart_id',t:'uuid · self-ref',fk:'stock_movements',nl:1,nw:1},
          {n:'adjustment_reason',t:'text',nl:1,nw:1},
          {n:'performed_by',t:'uuid',fk:'users'},
          {n:'performed_at',t:'timestamptz'},
        ]},
      { n:'narcotic_register', feature:'narcotic', desc:'NDPS-compliant Schedule X ledger — every transaction with running balance, prescriber, recipient, witness. Layer 2 maker-checker for wastage/adjustment. Append-only.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'medicine_id',t:'uuid',fk:'medicines'},
          {n:'medicine_batch_id',t:'uuid',fk:'medicine_batches',nl:1},
          {n:'pharmacy_sale_id',t:'uuid',fk:'pharmacy_sales',nl:1},
          {n:'prescription_id',t:'uuid',fk:'prescriptions',nl:1},
          {n:'transaction_type',t:"varchar · 'opening_balance'|'purchase_in'|'dispense_out'|'wastage'|'transfer_in'|'transfer_out'|'return'|'expired_writeoff'|'adjustment'"},
          {n:'quantity',t:'int · signed'},
          {n:'balance_after',t:'int · running balance per NDPS Act'},
          {n:'prescriber_name',t:'varchar',nl:1},
          {n:'prescriber_reg_no',t:'varchar',nl:1},
          {n:'recipient_name',t:'varchar',nl:1},
          {n:'recipient_relation',t:"varchar · 'self'|'spouse'|'parent'|'child'|'authorized_attendant'",nl:1},
          {n:'recipient_id_proof',t:'varchar · required for dispense_out',nl:1},
          {n:'witnessed_by',t:'uuid · two-person rule',fk:'users',nl:1},
          {n:'performed_by',t:'uuid',fk:'users'},
          {n:'performed_at',t:'timestamptz'},
          {n:'approval_status',t:"varchar · 'pending'|'approved'|'rejected' · for wastage/adjustment",nw:1},
          {n:'approved_by',t:'uuid',fk:'users',nl:1,nw:1},
          {n:'approved_at',t:'timestamptz',nl:1,nw:1},
          {n:'rejection_reason',t:'text',nl:1,nw:1},
          {n:'notes',t:'text',nl:1},
        ]},
    ]
  };
  renderModule(MODULE);
  </script>
</body>
</html>
