<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radiology — HMS Schema v8</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="../shared/manifest.js"></script>
  <script src="../shared/catalog.js"></script>
  <script src="../shared/renderer.js"></script>
  <script>
  // ─── EDIT BELOW ONLY. Do not touch HTML/script tags. ────────────────────
  const MODULE = {
    id: 'radiology',
    name: 'Radiology',
    color: '#3B8B55',
    bg: '#162010',
    lbg: '#E1F5EE',
    features: ['catalog', 'orders', 'studies', 'reports'],
    tables: [
      { n:'radiology_procedures', feature:'catalog', desc:'Procedure catalog — code, name, modality (xray/ct/mri/ultrasound), body part, default price, contrast/fasting/radiologist requirements.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants',nw:1},
          {n:'procedure_code',t:'varchar',uk:1},
          {n:'test_name',t:'varchar'},
          {n:'modality',t:"varchar · 'xray'|'ultrasound'|'ct'|'mri'|'mammography'|'dexa'|'fluoroscopy'|'nuclear'"},
          {n:'body_part',t:'varchar',nl:1},
          {n:'with_contrast',t:'boolean DEFAULT FALSE',nw:1},
          {n:'default_price',t:'decimal'},
          {n:'typical_duration_mins',t:'int',nl:1,nw:1},
          {n:'requires_fasting',t:'boolean DEFAULT FALSE',nw:1},
          {n:'requires_radiologist_presence',t:'boolean DEFAULT FALSE',nw:1},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'radiology_orders', feature:'orders', desc:'Imaging order header — patient, doctor, procedure, priority, payment gate, lifecycle status. With-contrast can be order-level override.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants',nw:1},
          {n:'order_number',t:'varchar · RAD-2026-12345',uk:1,nw:1},
          {n:'patient_id',t:'uuid',fk:'patients'},
          {n:'op_visit_id',t:'uuid',fk:'op_visits',nl:1},
          {n:'ip_admission_id',t:'uuid · phase 2',nl:1},
          {n:'consultation_id',t:'uuid',fk:'consultations',nl:1,nw:1},
          {n:'doctor_id',t:'uuid',fk:'users'},
          {n:'radiology_procedure_id',t:'uuid',fk:'radiology_procedures'},
          {n:'with_contrast',t:'boolean · order-level override',nl:1,nw:1},
          {n:'clinical_question',t:'text · what to look for',nl:1,nw:1},
          {n:'priority',t:"varchar · 'routine'|'urgent'|'stat'"},
          {n:'invoice_id',t:'uuid',fk:'invoices',nl:1},
          {n:'payment_required_before_service',t:'boolean DEFAULT true · stat overrides'},
          {n:'status',t:"varchar · 'ordered'|'awaiting_payment'|'paid'|'imaging_pending'|'imaging_in_progress'|'imaging_completed'|'reporting_pending'|'reported'|'released'|'cancelled'"},
          {n:'ordered_at',t:'timestamptz'},
          {n:'imaging_completed_at',t:'timestamptz',nl:1,nw:1},
          {n:'released_at',t:'timestamptz',nl:1,nw:1},
        ]},
      { n:'radiology_studies', feature:'studies', desc:'Captured study record — DICOM UID, accession number, image URLs, technician, completion time. PACS bridge.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'radiology_order_id',t:'uuid',fk:'radiology_orders'},
          {n:'study_uid',t:'varchar · DICOM',uk:1},
          {n:'accession_number',t:'varchar',uk:1,nw:1},
          {n:'modality_snapshot',t:'varchar',nw:1},
          {n:'body_part_snapshot',t:'varchar',nl:1,nw:1},
          {n:'technique',t:'text',nl:1,nw:1},
          {n:'images_count',t:'int',nl:1,nw:1},
          {n:'images_url',t:'text[]'},
          {n:'pacs_archive_status',t:"varchar · 'pending'|'archived'|'retrieval_failed'",nw:1},
          {n:'technician_id',t:'uuid',fk:'users'},
          {n:'study_started_at',t:'timestamptz',nl:1,nw:1},
          {n:'study_completed_at',t:'timestamptz'},
        ]},
      { n:'radiology_reports', feature:'reports', desc:'Radiologist findings + impression + recommendation for a study. Layer 2 maker-checker (junior reads, senior verifies). Amendment chain via amended_from_report_id.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'radiology_order_id',t:'uuid',fk:'radiology_orders'},
          {n:'study_id',t:'uuid',fk:'radiology_studies',nl:1},
          {n:'findings',t:'text',nl:1},
          {n:'impression',t:'text',nl:1},
          {n:'recommendation',t:'text',nl:1,nw:1},
          {n:'reported_by_radiologist_id',t:'uuid',fk:'users',nl:1},
          {n:'dictated_at',t:'timestamptz',nl:1,nw:1},
          {n:'release_status',t:"varchar · 'pending_verification'|'verified'|'released'|'amended'|'rejected'",nw:1},
          {n:'approval_status',t:"varchar · 'pending'|'approved'|'rejected'",nw:1},
          {n:'approved_by',t:'uuid',fk:'users',nl:1,nw:1},
          {n:'approved_at',t:'timestamptz',nl:1,nw:1},
          {n:'rejection_reason',t:'text',nl:1,nw:1},
          {n:'amended_from_report_id',t:'uuid',fk:'radiology_reports',nl:1,nw:1},
          {n:'amendment_reason',t:'text',nl:1,nw:1},
          {n:'file_attachment_id',t:'uuid',fk:'file_attachments',nl:1},
          {n:'report_pdf_url',t:'text',nl:1},
          {n:'uploaded_by',t:'uuid',fk:'users'},
          {n:'uploaded_at',t:'timestamptz'},
        ]},
    ]
  };
  renderModule(MODULE);
  </script>
</body>
</html>
