<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Platform · Tenancy — HMS Schema v8</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="../shared/manifest.js"></script>
  <script src="../shared/catalog.js"></script>
  <script src="../shared/renderer.js"></script>
  <script>
  // ─── EDIT BELOW ONLY. Do not touch HTML/script tags. ────────────────────
  const MODULE = {
    id: 'platform-tenancy',
    name: 'Platform · Tenancy',
    color: '#9B7EE8',
    bg: '#221c3a',
    lbg: '#EFEDFB',
    features: ['tenant', 'identity', 'rbac', 'session', 'config', 'preferences', 'calendar'],
    tables: [
      { n:'tenants', feature:'tenant', desc:'Hospital identity — top-level organization. Every other row partitions on tenant_id.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_code',t:"varchar · 'KH' (Kumudha Hospital, Villupuram) — UHID prefix",uk:1},
          {n:'hospital_name',t:'varchar'},
          {n:'address',t:'text',nl:1},
          {n:'gst_number',t:'varchar',nl:1},
          {n:'license_number',t:'varchar',nl:1},
          {n:'logo_path',t:'text',nl:1},
          {n:'timezone',t:"varchar DEFAULT 'Asia/Kolkata'",nw:1,desc:'IANA timezone — drives day boundaries for session/business reports.'},
          {n:'uhid_prefix',t:"varchar DEFAULT 'UHID'"},
          {n:'uhid_separator',t:"varchar(1) DEFAULT '-'"},
          {n:'uhid_sequence_padding',t:'int DEFAULT 6'},
          {n:'uhid_include_year',t:'boolean DEFAULT TRUE'},
          {n:'is_active',t:'boolean'},
          {n:'created_at',t:'timestamptz'},
        ]},
      { n:'users', feature:'identity', desc:'All staff accounts — doctors, nurses, receptionists, pharmacists, admins. One row per employee.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'employee_id',t:'varchar',uk:1},
          {n:'full_name',t:'varchar'},
          {n:'mobile',t:'varchar',uk:1},
          {n:'email',t:'varchar',nl:1},
          {n:'username',t:'varchar',uk:1},
          {n:'password_hash',t:'varchar'},
          {n:'department_id',t:'uuid',fk:'departments',nl:1},
          {n:'designation',t:'varchar',nl:1},
          {n:'profile_data',t:'jsonb · role-specific'},
          {n:'status',t:"varchar · 'active'|'inactive'|'suspended'"},
          {n:'last_login_at',t:'timestamptz',nl:1},
          {n:'created_by',t:'uuid',fk:'users',nl:1},
          {n:'created_at',t:'timestamptz'},
          {n:'updated_by',t:'uuid',fk:'users',nl:1},
          {n:'updated_at',t:'timestamptz'},
          {n:'version',t:'int DEFAULT 0'},
        ]},
      { n:'departments', feature:'identity', desc:'Functional units (Ortho, Derma, Lab, Pharmacy…). Drives routing, fees, and reporting splits.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'dept_name',t:'varchar'},
          {n:'dept_code',t:'varchar',uk:1},
          {n:'segment',t:"varchar · 'ortho'|'derma'|'lab'|'pharma'…"},
          {n:'head_doctor_id',t:'uuid',fk:'users',nl:1},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'doctor_profiles', feature:'identity', desc:'Doctor-only attributes — specialization, fees, slot duration, signature. Extends users for clinical staff.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'user_id',t:'uuid',fk:'users',uk:1},
          {n:'specialization',t:'varchar',nl:1},
          {n:'qualification',t:'varchar',nl:1},
          {n:'registration_number',t:'varchar',nl:1},
          {n:'consultation_fee',t:'decimal',nl:1},
          {n:'follow_up_fee',t:'decimal',nl:1},
          {n:'follow_up_window_days',t:'int DEFAULT 7'},
          {n:'available_days',t:'jsonb',nl:1},
          {n:'slot_duration_mins',t:'int'},
          {n:'signature_path',t:'text',nl:1},
        ]},
      { n:'roles', feature:'rbac', desc:'Named role definitions (admin, receptionist, doctor…) used for permission grouping.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'role_name',t:'varchar',uk:1},
          {n:'description',t:'text',nl:1},
          {n:'is_system_role',t:'boolean'},
        ]},
      { n:'user_roles', feature:'rbac', desc:'Many-to-many user↔role assignments. A user can hold multiple roles with one default landing role.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'user_id',t:'uuid',fk:'users'},
          {n:'role_id',t:'uuid',fk:'roles'},
          {n:'is_default',t:"boolean DEFAULT FALSE · landing role"},
          {n:'assigned_by',t:'uuid',fk:'users',nl:1},
          {n:'assigned_at',t:'timestamptz'},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'permissions', feature:'rbac', desc:'Atomic permission keys (e.g. pharmacy.stock.edit). The catalog of every gated action.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'permission_key',t:'varchar · pharmacy.stock.edit',uk:1},
          {n:'module_name',t:'varchar'},
          {n:'action_name',t:'varchar'},
          {n:'description',t:'text',nl:1},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'role_permissions', feature:'rbac', desc:'Grants — which permissions a role carries. Joining table for role↔permission.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'role_id',t:'uuid',fk:'roles'},
          {n:'permission_id',t:'uuid',fk:'permissions'},
          {n:'granted_by',t:'uuid',fk:'users',nl:1},
          {n:'granted_at',t:'timestamptz'},
        ]},
      { n:'user_sessions', feature:'session', desc:'Active login sessions. Token hash, device, expiry — used by the auth middleware.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'user_id',t:'uuid',fk:'users'},
          {n:'token_hash',t:'varchar'},
          {n:'ip_address',t:'varchar',nl:1},
          {n:'device_info',t:'text',nl:1},
          {n:'created_at',t:'timestamptz'},
          {n:'expires_at',t:'timestamptz'},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'system_config', feature:'config', desc:'Tenant-scoped key/value settings. Layer 2 maker-checker on changes.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'config_key',t:'varchar',uk:1},
          {n:'config_value',t:'text'},
          {n:'description',t:'text',nl:1},
          {n:'approval_status',t:"varchar · 'pending'|'approved'|'rejected'",nw:1},
          {n:'approved_by',t:'uuid',fk:'users',nl:1,nw:1},
          {n:'approved_at',t:'timestamptz',nl:1,nw:1},
          {n:'rejection_reason',t:'text',nl:1,nw:1},
          {n:'updated_by',t:'uuid',fk:'users'},
          {n:'updated_at',t:'timestamptz'},
        ]},
      { n:'user_preferences', feature:'preferences', desc:'Per-user UI settings — theme, language, default landing role/path, notification channels.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'user_id',t:'uuid',fk:'users',uk:1},
          {n:'default_role_id',t:'uuid',fk:'roles',nl:1},
          {n:'default_landing_path',t:"varchar · '/doctor/queue'",nl:1},
          {n:'theme',t:"varchar DEFAULT 'system' · light|dark|system"},
          {n:'language',t:"varchar DEFAULT 'en'"},
          {n:'date_format',t:"varchar DEFAULT 'DD-MM-YYYY'"},
          {n:'notifications_email',t:'boolean DEFAULT TRUE'},
          {n:'notifications_inapp',t:'boolean DEFAULT TRUE'},
          {n:'notifications_sms',t:'boolean DEFAULT FALSE'},
          {n:'updated_at',t:'timestamptz'},
        ]},
      { n:'tenant_holidays', feature:'calendar', nw:1, desc:'Hospital closure calendar — blocks slot generation per service area (OP/IP/pharmacy/lab/radiology).',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'holiday_date',t:'date'},
          {n:'holiday_name',t:'varchar'},
          {n:'holiday_type',t:"varchar · 'national'|'regional'|'restricted'|'hospital'"},
          {n:'affects_op',t:'boolean DEFAULT TRUE'},
          {n:'affects_ip',t:'boolean DEFAULT FALSE'},
          {n:'affects_pharmacy',t:'boolean DEFAULT FALSE'},
          {n:'affects_lab',t:'boolean DEFAULT TRUE'},
          {n:'affects_radiology',t:'boolean DEFAULT TRUE'},
          {n:'notes',t:'text',nl:1},
          {n:'created_by',t:'uuid',fk:'users'},
          {n:'created_at',t:'timestamptz'},
        ]},
      { n:'doctor_schedules', feature:'calendar', nw:1, desc:'Per-doctor weekly availability template, used to generate appointment_slots.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'doctor_id',t:'uuid',fk:'users'},
          {n:'day_of_week',t:'int · 0=Sun..6=Sat'},
          {n:'start_time',t:'time'},
          {n:'end_time',t:'time'},
          {n:'slot_duration_mins',t:'int'},
          {n:'effective_from',t:'date'},
          {n:'effective_to',t:'date',nl:1},
          {n:'is_active',t:'boolean DEFAULT TRUE'},
        ]},
    ]
  };
  renderModule(MODULE);
  </script>
</body>
</html>
