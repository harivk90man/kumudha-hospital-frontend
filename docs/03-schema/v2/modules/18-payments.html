<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payments — HMS Schema v8</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="../shared/manifest.js"></script>
  <script src="../shared/catalog.js"></script>
  <script src="../shared/renderer.js"></script>
  <script>
  // ─── EDIT BELOW ONLY. Do not touch HTML/script tags. ────────────────────
  const MODULE = {
    id: 'payments',
    name: 'Payments',
    color: '#D8951F',
    bg: '#2a1d08',
    lbg: '#FEF2DE',
    features: ['payee', 'payment', 'allocation', 'item-bridge', 'detail', 'cash-session'],
    tables: [
      { n:'payees', feature:'payee', desc:'Who paid or received money — patient, walk-in, vendor, employee, insurance. Decouples payment from UHID.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'payee_type',t:"varchar · 'patient'|'walk_in'|'vendor'|'employee'|'insurance'|'other'"},
          {n:'patient_id',t:'uuid · if patient',fk:'patients',nl:1},
          {n:'vendor_id',t:'uuid · if pharma vendor',fk:'vendors',nl:1},
          {n:'employee_user_id',t:'uuid · if employee advance',fk:'users',nl:1},
          {n:'insurance_tpa_name',t:'varchar · phase 2',nl:1,nw:1},
          {n:'name',t:'varchar · for walk-in or other',nl:1},
          {n:'mobile',t:'varchar',nl:1},
          {n:'gstin',t:'varchar · for B2B',nl:1},
          {n:'notes',t:'text',nl:1},
          {n:'created_at',t:'timestamptz'},
        ]},
      { n:'payments', feature:'payment', desc:'Money-movement event — cash, card, UPI, cheque, insurance. Direction in (collection) or out (refund).',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'invoice_id',t:'uuid · nullable when paying via allocation',fk:'invoices',nl:1},
          {n:'payee_id',t:'uuid · who paid or received',fk:'payees'},
          {n:'payment_direction',t:"varchar · 'in' (collection) | 'out' (refund/payout)"},
          {n:'cash_session_id',t:'uuid',fk:'cash_sessions'},
          {n:'payment_mode',t:"varchar · 'cash'|'card'|'upi'|'cheque'|'net_banking'|'insurance'|'other'"},
          {n:'amount',t:'decimal'},
          {n:'transaction_ref',t:'varchar',nl:1},
          {n:'paid_at',t:'timestamptz'},
          {n:'received_by',t:'uuid',fk:'users'},
          {n:'idempotency_key',t:'varchar · UNIQUE partial — prevents double-charge',nl:1},
          {n:'version',t:'int DEFAULT 0 · optimistic lock'},
          {n:'notes',t:'text',nl:1},
        ]},
      { n:'payment_allocations', feature:'allocation', desc:'Splits — how a payment was applied across invoices, advances, refunds, credit notes. One payment → many allocations.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'payment_id',t:'uuid',fk:'payments'},
          {n:'allocation_type',t:"varchar · 'invoice'|'pharmacy_sale'|'ip_advance'|'interim_bill'|'refund'|'on_account'|'credit_note_application'"},
          {n:'invoice_id',t:'uuid',fk:'invoices',nl:1},
          {n:'pharmacy_sale_id',t:'uuid',fk:'pharmacy_sales',nl:1},
          {n:'ip_admission_id',t:'uuid · phase 2',nl:1},
          {n:'interim_bill_id',t:'uuid · phase 2',nl:1},
          {n:'credit_note_id',t:'uuid',fk:'credit_notes',nl:1,nw:1},
          {n:'amount',t:'decimal'},
          {n:'notes',t:'text',nl:1},
          {n:'created_at',t:'timestamptz'},
        ]},
      { n:'payment_item_types', feature:'item-bridge', desc:'Discriminator catalog for payment lines (xray, pharmacy, consultation, lab, cafeteria). Stable IDs across deploys.',
        f:[
          {n:'id',t:'int',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'code',t:"varchar · 'xray'|'pharmacy'|'consultation'|'lab'|'cafeteria'",uk:1},
          {n:'display_name',t:'varchar · X-Ray|Pharmacy|Consultation|Lab|Cafeteria'},
          {n:'detail_table',t:"varchar · 'payment_xray'|'payment_pharmacy'|'payment_consultation'|'payment_lab'|'payment_cafeteria'"},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'payment_items', feature:'item-bridge', desc:'Bridge between payment and source detail row. Separate-column FKs (payment_xray_id|payment_pharmacy_id|payment_consultation_id|payment_lab_id|payment_cafeteria_id) — exactly-one-non-null.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'payment_id',t:'uuid',fk:'payments'},
          {n:'payment_type_id',t:'int · which source',fk:'payment_item_types'},
          {n:'payment_xray_id',t:'uuid',fk:'payment_xray',nl:1,nw:1},
          {n:'payment_pharmacy_id',t:'uuid',fk:'payment_pharmacy',nl:1,nw:1},
          {n:'payment_consultation_id',t:'uuid',fk:'payment_consultation',nl:1,nw:1},
          {n:'payment_lab_id',t:'uuid',fk:'payment_lab',nl:1,nw:1},
          {n:'payment_cafeteria_id',t:'uuid',fk:'payment_cafeteria',nl:1,nw:1},
          {n:'amount',t:'decimal · line ₹'},
          {n:'_check',t:'CHECK (num_nonnulls(payment_xray_id, payment_pharmacy_id, payment_consultation_id, payment_lab_id, payment_cafeteria_id) = 1)',nw:1},
          {n:'created_at',t:'timestamptz'},
        ]},
      { n:'payment_consultation', feature:'detail', desc:'Per-consultation line on a payment — doctor, visit type, fee, discount.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'consultation_id',t:'uuid',fk:'consultations'},
          {n:'doctor_id',t:'uuid',fk:'users'},
          {n:'visit_type',t:"varchar · 'new'|'follow_up'"},
          {n:'fee',t:'decimal'},
          {n:'discount',t:'decimal DEFAULT 0'},
          {n:'amount',t:'decimal'},
        ]},
      { n:'payment_lab', feature:'detail', desc:'Per-test line on a payment.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'lab_order_id',t:'uuid',fk:'lab_orders'},
          {n:'test_name',t:'varchar · CBC|LFT|Diabetes Panel'},
          {n:'sample_type',t:'varchar',nl:1},
          {n:'rate',t:'decimal'},
          {n:'discount',t:'decimal DEFAULT 0'},
          {n:'amount',t:'decimal'},
        ]},
      { n:'payment_pharmacy', feature:'detail', desc:'Per-medicine line on a payment.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'pharmacy_sale_id',t:'uuid',fk:'pharmacy_sales'},
          {n:'medicine_name',t:'varchar'},
          {n:'batch_no',t:'varchar',nl:1},
          {n:'quantity',t:'int'},
          {n:'unit_price',t:'decimal'},
          {n:'discount',t:'decimal DEFAULT 0'},
          {n:'amount',t:'decimal'},
        ]},
      { n:'payment_xray', feature:'detail', desc:'Per-X-ray line on a payment — procedure, modality snapshot.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'radiology_order_id',t:'uuid',fk:'radiology_orders'},
          {n:'procedure_name',t:'varchar · CXR PA view|MRI Brain'},
          {n:'modality',t:"varchar · 'xray'|'ct'|'mri'|'ultrasound'"},
          {n:'rate',t:'decimal'},
          {n:'quantity',t:'int DEFAULT 1'},
          {n:'discount',t:'decimal DEFAULT 0'},
          {n:'amount',t:'decimal · final ₹ for this line'},
        ]},
      { n:'payment_cafeteria', feature:'detail', desc:'Per-cafeteria line on a payment — external POS reference.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'order_ref',t:'varchar · external POS ref',nl:1},
          {n:'item_name',t:'varchar'},
          {n:'quantity',t:'int'},
          {n:'unit_price',t:'decimal'},
          {n:'amount',t:'decimal'},
        ]},
      { n:'cash_counters', feature:'cash-session', desc:'Physical cash collection points (Front Desk, Pharmacy, IP Billing).',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'counter_code',t:'varchar',uk:1,nw:1},
          {n:'name',t:'varchar · Front Desk|Pharmacy|IP Billing'},
          {n:'location',t:'varchar',nl:1},
          {n:'is_active',t:'boolean'},
        ]},
      { n:'cash_sessions', feature:'cash-session', desc:'One cashier shift on one counter (renamed from business_sessions). Float, expected vs counted, variance, denomination breakdown, closure PDF.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'counter_id',t:'uuid',fk:'cash_counters'},
          {n:'session_number',t:'varchar',uk:1,nw:1},
          {n:'session_label',t:"varchar · 'MORNING'|'EVENING'|'NIGHT'|'FULL_DAY'|'CUSTOM'"},
          {n:'business_date',t:'date'},
          {n:'opened_by',t:'uuid',fk:'users'},
          {n:'opened_at',t:'timestamptz'},
          {n:'closed_by',t:'uuid',fk:'users',nl:1},
          {n:'closed_at',t:'timestamptz',nl:1},
          {n:'status',t:"varchar · 'OPEN'|'CLOSED'|'REOPENED'|'LOCKED'"},
          {n:'opening_float',t:'decimal'},
          {n:'expected_cash',t:'decimal',nl:1},
          {n:'counted_cash',t:'decimal',nl:1},
          {n:'variance',t:'decimal GENERATED · counted − expected',nl:1,nw:1},
          {n:'variance_reason',t:'text',nl:1},
          {n:'denomination_breakdown',t:"jsonb · {2000:5, 500:20, ...}",nl:1},
          {n:'closure_notes',t:'text',nl:1},
          {n:'closure_report_pdf_url',t:'text',nl:1},
          {n:'approved_by',t:'uuid',fk:'users',nl:1},
        ]},
      { n:'session_movements', feature:'cash-session', desc:'Non-payment cash movements during a session — expense payouts, refunds, deposits, handovers.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'cash_session_id',t:'uuid',fk:'cash_sessions'},
          {n:'movement_type',t:"varchar · 'EXPENSE_PAYOUT'|'REFUND_PAYOUT'|'PETTY_CASH_OUT'|'CASH_DEPOSIT_TO_BANK'|'CASH_HANDOVER'"},
          {n:'amount',t:'decimal'},
          {n:'reason',t:'text'},
          {n:'reference_doc_url',t:'text',nl:1},
          {n:'performed_by',t:'uuid',fk:'users'},
          {n:'performed_at',t:'timestamptz'},
        ]},
    ]
  };
  renderModule(MODULE);
  </script>
</body>
</html>
