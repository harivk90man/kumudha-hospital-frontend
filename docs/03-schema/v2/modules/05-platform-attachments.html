<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Platform · Attachments — HMS Schema v8</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="../shared/manifest.js"></script>
  <script src="../shared/catalog.js"></script>
  <script src="../shared/renderer.js"></script>
  <script>
  // ─── EDIT BELOW ONLY. Do not touch HTML/script tags. ────────────────────
  const MODULE = {
    id: 'platform-attachments',
    name: 'Platform · Attachments',
    color: '#7B6BC0',
    bg: '#1c1730',
    lbg: '#EBE6F8',
    features: ['files', 'templates'],
    tables: [
      { n:'document_templates', feature:'templates', desc:'Reusable rendering templates — consultation notes, discharge summaries, prescriptions, lab reports. Versioned per edit.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'template_type',t:"varchar · 'consultation'|'discharge_summary'|'prescription'|'lab_report'|'inventory_request'|'op_notes'"},
          {n:'name',t:'varchar'},
          {n:'category',t:"varchar · by diagnosis or procedure",nl:1},
          {n:'department_id',t:'uuid',fk:'departments',nl:1},
          {n:'icd10_code',t:'varchar',nl:1},
          {n:'content',t:'jsonb · structure varies by template_type'},
          {n:'applicable_role_ids',t:'uuid[] · which roles can use',nl:1},
          {n:'version',t:'int DEFAULT 1 · increment on edit'},
          {n:'usage_count',t:'int DEFAULT 0'},
          {n:'is_active',t:'boolean DEFAULT true'},
          {n:'created_by',t:'uuid',fk:'users'},
          {n:'created_at',t:'timestamptz'},
          {n:'updated_at',t:'timestamptz'},
        ]},
      { n:'file_attachments', feature:'files', desc:'Polymorphic blob storage. Any business entity may attach files (consultations, lab results, radiology reports, govt-ID scans). Nightly orphan-check job.',
        f:[
          {n:'id',t:'uuid',pk:1},
          {n:'tenant_id',t:'uuid',fk:'tenants'},
          {n:'patient_id',t:'uuid',fk:'patients',nl:1},
          {n:'entity_table',t:"varchar · 'consultations'|'lab_results'|… (polymorphic — orphan-check)",nw:1},
          {n:'entity_id',t:'uuid',nw:1},
          {n:'file_name',t:'varchar'},
          {n:'file_type',t:'varchar'},
          {n:'file_path',t:'text'},
          {n:'mime_type',t:'varchar',nl:1},
          {n:'size_bytes',t:'bigint',nl:1},
          {n:'uploaded_by',t:'uuid',fk:'users'},
          {n:'uploaded_at',t:'timestamptz'},
        ]},
    ]
  };
  renderModule(MODULE);
  </script>
</body>
</html>
