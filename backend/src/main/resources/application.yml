spring:
  application:
    name: hospital-management

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-on-validation-error: true  # DEV ONLY — drops and reruns all migrations on checksum mismatch
    clean-disabled: false             # DEV ONLY — must be false for clean-on-validation-error to work

hms:
  auth:
    jwt-secret: hms-default-secret-change-in-prod-min-32-chars!!
    token-expiry-hours: 8
    max-failed-attempts: 5
    lockout-minutes: 30

server:
  port: 8080
